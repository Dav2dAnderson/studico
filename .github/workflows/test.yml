name: DRF CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: studico_db
          POSTGRES_USER: david
          POSTGRES_PASSWORD: Htp627ClC
        ports:
          - 5432:5432 
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: run tests
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_NAME: studico_db
          DB_USER: david
          DB_PASSWORD: Htp627ClC
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py migrate
          python manage.py test